<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM YANGUERITO VIP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f7f7f7;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.loader-container{
text-align:center;
padding:20px;
}

.logo-img{
width:180px;
max-width:80%;
margin-bottom:20px;
}

.title{
font-size:48px;
font-weight:bold;
color:#7d3d3d;
margin-bottom:10px;
}

.subtitle{
font-size:28px;
color:#666;
margin-bottom:25px;
}

.loading-text{
margin-top:20px;
color:#999;
font-size:18px;
}

.spinner{
width:55px;
height:55px;
border:6px solid #ddd;
border-top:6px solid #7d3d3d;
border-radius:50%;
animation:girar 1s linear infinite;
margin:auto;
}

@keyframes girar{
100%{
transform:rotate(360deg);
}
}
</style>
</head>

<body>

<div class="loader-container">

<img src="logo.png" class="logo-img">

<div class="title">
TEAM YANGUERITO VIP
</div>

<div class="subtitle">
Iniciando programa VIP...
</div>

<div class="spinner"></div>

<div class="loading-text">
Conectando con sistema de puntos...
</div>

</div>
