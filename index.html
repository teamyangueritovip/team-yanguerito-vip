<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEAM YANGUERITO VIP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
height:100vh;
overflow:hidden;
}

iframe{
width:100%;
height:100vh;
border:none;
}

.loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(135deg,#f8f8f8,#ececec);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.logo{
width:120px;
height:120px;
border-radius:35px;
background:#6d0f14;
display:flex;
justify-content:center;
align-items:center;
font-size:52px;
font-weight:900;
color:white;
box-shadow:
0 12px 35px rgba(0,0,0,.18);
}

.title{
margin-top:22px;
font-size:28px;
font-weight:900;
color:#7f1419;
}

.subtitle{
margin-top:10px;
font-size:16px;
color:#777;
}

.spinner{
margin-top:30px;
width:45px;
height:45px;
border:5px solid #ddd;
border-top:5px solid #7f1419;
border-radius:50%;
animation:giro 1s linear infinite;
}

@keyframes giro{
100%{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<div class="loader" id="loader">

<div class="logo">
TY
</div>

<div class="title">
TEAM YANGUERITO VIP
</div>

<div class="subtitle">
Cargando programa VIP...
</div>

<div class="spinner"></div>

</div>

<iframe
src="https://script.google.com/macros/s/AKfycbzBS-OzJLN1Od51BMECULB0iWg6mDahGPfT5FMPthQYWAESfRBcEFaCEfeLw_fEHmK-Ng/exec"
onload="ocultarLoader()">
</iframe>

<script>

function ocultarLoader(){
setTimeout(()=>{
document
.getElementById("loader")
.style.display="none";
},1200);
}

</script>

</body>
</html>
